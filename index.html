<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhotoVault Lite</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>PhotoVault Lite</h1><p>Private photo timeline. Your files never leave this device.</p></div><div class="actions"><button id="open">Open photo folder</button><button id="dupes">Find duplicates</button><button id="export">Export index</button></div></header><section class="tools"><input id="q" placeholder="Search filename or path…"><select id="album"><option value="">All folders</option></select><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Name</option><option value="size">Largest</option></select><label><input id="favOnly" type="checkbox"> Favorites</label><span id="status">No folder selected.</span></section><main id="main"></main><dialog id="dlg"><form method="dialog"><button class="close">Close</button><h2>Duplicates</h2><div id="dupeList"></div></form></dialog><dialog id="details"><form method="dialog"><button class="close">Close</button><h2 id="detailTitle">Photo details</h2><img id="detailImg" class="preview"><dl id="detailMeta"></dl><button type="button" id="toggleFav">Toggle favorite</button></form></dialog><script src="app.js"></script></body></html>
